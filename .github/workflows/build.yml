name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/pkg/licenses | Out-Null
          Copy-Item target/release/capview.exe, README.md, LICENSE dist/pkg/
          Copy-Item assets/fonts/OFL-*.txt dist/pkg/licenses/
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/capview-v$v-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: capview-windows
          path: dist/*.zip
      # The Windows release zip is built locally by packaging/windows/package.ps1,
      # because RTX Video needs the NVIDIA SDK, which can't live in this repo.

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: capview-macos
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
